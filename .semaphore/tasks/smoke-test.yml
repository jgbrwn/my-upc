version: v1.0
name: Daily Smoke Test (Playwright)

# Provide an agent block so the pipeline validates. If you selected a machine in the Semaphore UI,
# the UI setting will take precedence at runtime; keeping this block satisfies the schema.
# Updated to use f1-standard-2 and ubuntu2404 per request.
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 30

blocks:
  - name: Install & run Playwright smoke test
    task:
      jobs:
        - name: Playwright smoke
          commands:
            - checkout
            - echo "Node 20 is preinstalled on Semaphore Linux images; skipping Node installation"

            - echo "Install Playwright and dependencies"
            - |
              if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                npm ci --no-audit --no-fund
              else
                npm install --no-audit --no-fund
              fi
            - npx playwright install --with-deps chromium

            - echo "Run smoke test"
            # Run the single smoke spec. Capture artifacts on failure.
            - |
              set -o pipefail
              if ! npx playwright test e2e/smoke.spec.js; then
                echo "Smoke test failed — collecting Playwright report and artifacts"
                mkdir -p artifacts/playwright-report
                cp -R playwright-report artifacts/playwright-report 2>/dev/null || true
                cp -R test-results artifacts/test-results 2>/dev/null || true
                exit 1
              fi

      epilogue:
        always:
          commands:
            - test -d artifacts && semaphore artifact create artifacts || echo "No artifacts to upload"

# Scheduling can be managed in Semaphore's UI or via a separate schedule resource; no in-file schedule is declared here.
