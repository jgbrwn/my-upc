version: v1.0
name: Daily Smoke Test (Playwright)

# Agent block (keeps schema valid). The UI-selected machine will take precedence at runtime.
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 30

blocks:
  - name: Install & run Playwright smoke test
    task:
      jobs:
        - name: Playwright smoke
          commands:
            - checkout
            - echo "Node 20 is preinstalled on Semaphore Linux images; skipping Node installation"

            - echo "Install Playwright and dependencies (with caching when possible)"
            - |
              # Strategy:
              # - If package.json exists: prefer npm ci (if lockfile) or npm install.
              # - Use Semaphore cache keyed by checksum(package-lock.json) or checksum(package.json) when present.
              # - If no package.json, create a minimal one and install @playwright/test (transient install).

              if [ -f package.json ]; then
                if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                  CACHE_KEY=node-modules-$(checksum package-lock.json)
                  echo "Restoring cache: $CACHE_KEY"
                  cache restore $CACHE_KEY || true
                  npm ci --no-audit --no-fund
                  echo "Storing cache: $CACHE_KEY"
                  cache store $CACHE_KEY node_modules || true
                else
                  CACHE_KEY=node-modules-$(checksum package.json)
                  echo "Restoring cache: $CACHE_KEY"
                  cache restore $CACHE_KEY || true
                  npm install --no-audit --no-fund
                  echo "Storing cache: $CACHE_KEY"
                  cache store $CACHE_KEY node_modules || true
                fi
              else
                echo "No package.json found — creating minimal package.json and installing @playwright/test"
                npm init -y
                npm install @playwright/test --no-audit --no-fund
              fi

            - npx playwright install --with-deps chromium

            - echo "Run smoke test (generate HTML report)"
            # Run the single smoke spec. Capture artifacts on failure.
            - |
              set -o pipefail
              if ! npx playwright test e2e/smoke.spec.js --reporter=html; then
                echo "Smoke test failed — collecting Playwright report and artifacts"
                mkdir -p artifacts/playwright-report
                cp -R playwright-report artifacts/playwright-report 2>/dev/null || true
                cp -R test-results artifacts/test-results 2>/dev/null || true
                exit 1
              fi

      epilogue:
        always:
          commands:
            - test -d artifacts && semaphore artifact create artifacts || echo "No artifacts to upload"

# Scheduling can be managed in Semaphore's UI or via a separate schedule resource; no in-file schedule is declared here.
